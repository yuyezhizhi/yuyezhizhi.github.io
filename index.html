<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>好玩的动画 - yuyezhizhi</title>
    <meta name="description" content="分享前端开发技术、Vue、React、JavaScript等知识" />
    <!-- 内容安全策略 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' https://www.soundhelix.com;" />
    <!-- XSS 保护 -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <!-- 防止点击劫持 - X-Frame-Options 必须通过 HTTP 响应头设置，meta 标签无效 -->
    <!-- 请在服务器配置中设置: X-Frame-Options: SAMEORIGIN -->
    <!-- 强制 HTTPS - HSTS 需要通过服务器响应头配置，meta 标签无效 -->
    <!-- p5.sound 将通过 npm 导入，不再使用 CDN -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
